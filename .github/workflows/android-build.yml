name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tower-defence-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish debug APK to a downloadable release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: Tower Defence — latest debug build
          body: |
            Automated debug APK, rebuilt from the latest push to `${{ github.ref_name }}` (${{ github.sha }}).

            To install on Android: download `app-debug.apk` below, open it from your downloads,
            and allow "install unknown apps" for your browser when prompted.
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
